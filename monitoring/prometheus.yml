
global:
  scrape_interval: 5s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitor the House Price metrics server
  - job_name: "house-price"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8008"]
